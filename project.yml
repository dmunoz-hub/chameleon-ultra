name: ChameleonLF
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Automatic signing with your free Apple ID.
    # Set your 10-char Team ID here, OR pass DEVELOPMENT_TEAM=XXXXXXXXXX on the xcodebuild command line.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  ChameleonLF:
    type: application
    platform: iOS
    sources:
      - path: ChameleonLF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chameleonlf
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ChameleonLF/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ENABLE_PREVIEWS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: ChameleonLF/ChameleonLF-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/ChameleonLF/Solver
        # The pm3-derived C is warning-heavy; keep the build log clean.
        GCC_WARN_INHIBIT_ALL_WARNINGS: "YES"
